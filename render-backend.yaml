services:
  - type: web
    name: servicios-store-backend
    env: docker
    dockerfilePath: ./Dockerfile.render.simple
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        fromDatabase:
          name: servicios-store-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /api/health

databases:
  - name: servicios-store-db
    plan: free
    databaseName: servicios_store
    user: admin
