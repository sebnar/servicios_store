<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test CORS - Servicios Store</title>
</head>
<body>
    <h1>Test CORS - Login</h1>
    <div id="result"></div>
    
    <script>
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@serviciosstore.com',
                        password: 'admin123456'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <h2 style="color: green;">✅ Login exitoso!</h2>
                        <p><strong>Mensaje:</strong> ${data.message}</p>
                        <p><strong>Token:</strong> ${data.token.substring(0, 50)}...</p>
                        <p><strong>Usuario:</strong> ${data.user.username} (${data.user.role})</p>
                    `;
                } else {
                    const error = await response.json();
                    resultDiv.innerHTML = `
                        <h2 style="color: red;">❌ Error en login</h2>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p><strong>Status:</strong> ${response.status}</p>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h2 style="color: red;">❌ Error CORS o de conexión</h2>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p><strong>Tipo:</strong> ${error.name}</p>
                `;
            }
        }
        
        // Ejecutar test al cargar la página
        testLogin();
    </script>
</body>
</html>
