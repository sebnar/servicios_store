<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test CORS Final</title>
</head>
<body>
    <h1>Test CORS Final - Servicios Store</h1>
    <div id="result"></div>
    
    <script>
        async function testCors() {
            const resultDiv = document.getElementById('result');
            
            try {
                console.log('🔍 Probando health check...');
                const healthResponse = await fetch('http://localhost:5000/api/health', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                if (healthResponse.ok) {
                    const healthData = await healthResponse.json();
                    console.log('✅ Health check OK:', healthData);
                    
                    resultDiv.innerHTML += `
                        <div style="color: green; margin: 10px 0;">
                            ✅ Health Check: ${healthData.message}
                        </div>
                    `;
                    
                    // Probar login
                    console.log('🔍 Probando login...');
                    const loginResponse = await fetch('http://localhost:5000/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            email: 'admin@serviciosstore.com',
                            password: 'admin123456'
                        })
                    });
                    
                    if (loginResponse.ok) {
                        const loginData = await loginResponse.json();
                        console.log('✅ Login OK:', loginData);
                        
                        resultDiv.innerHTML += `
                            <div style="color: green; margin: 10px 0;">
                                ✅ Login: ${loginData.message}
                            </div>
                        `;
                        
                        // Probar crear servicio
                        console.log('🔍 Probando crear servicio...');
                        const serviceResponse = await fetch('http://localhost:5000/api/admin/services', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${loginData.token}`
                            },
                            body: JSON.stringify({
                                name: 'Test Service',
                                description: 'Servicio de prueba',
                                price: 100,
                                currency: 'USD',
                                category: 'Test',
                                features: ['Test feature'],
                                tags: ['test']
                            })
                        });
                        
                        if (serviceResponse.ok) {
                            const serviceData = await serviceResponse.json();
                            console.log('✅ Crear servicio OK:', serviceData);
                            
                            resultDiv.innerHTML += `
                                <div style="color: green; margin: 10px 0;">
                                    ✅ Crear Servicio: ${serviceData.message}
                                </div>
                            `;
                        } else {
                            const error = await serviceResponse.json();
                            console.log('❌ Crear servicio Error:', error);
                            
                            resultDiv.innerHTML += `
                                <div style="color: red; margin: 10px 0;">
                                    ❌ Crear Servicio Error: ${error.message}
                                </div>
                            `;
                        }
                    } else {
                        const error = await loginResponse.json();
                        console.log('❌ Login Error:', error);
                        
                        resultDiv.innerHTML += `
                            <div style="color: red; margin: 10px 0;">
                                ❌ Login Error: ${error.message}
                            </div>
                        `;
                    }
                } else {
                    console.log('❌ Health check failed:', healthResponse.status);
                    
                    resultDiv.innerHTML += `
                        <div style="color: red; margin: 10px 0;">
                            ❌ Health Check Failed: ${healthResponse.status}
                        </div>
                    `;
                }
            } catch (error) {
                console.log('❌ CORS Error:', error);
                
                resultDiv.innerHTML += `
                    <div style="color: red; margin: 10px 0;">
                        ❌ CORS Error: ${error.message}
                    </div>
                `;
            }
        }
        
        // Ejecutar test al cargar la página
        testCors();
    </script>
</body>
</html>
