services:
  # Servicio de Backend
  - type: web
    name: servicios-store-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        fromDatabase:
          name: servicios-store-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # Servicio de Frontend
  - type: web
    name: servicios-store-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://servicios-store-backend.onrender.com

  # Base de datos MongoDB
  - type: pserv
    name: servicios-store-db
    env: docker
    dockerfilePath: ./Dockerfile.mongodb
    plan: free
