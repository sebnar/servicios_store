services:
  - type: web
    name: servicios-store-unified
    env: docker
    dockerfilePath: ./Dockerfile.final
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        fromDatabase:
          name: servicios-store-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_API_URL
        value: https://servicios-store-unified.onrender.com/api
    healthCheckPath: /api/health

databases:
  - name: servicios-store-db
    plan: free
    databaseName: servicios_store
    user: admin
